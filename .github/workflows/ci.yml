name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/smoke.py
      - run: bash .claude/hooks/guard-gcloud.sh --self-test
      - run: for s in scripts/*.py; do python3 "$s" --self-test; done
      - run: for d in cases/*/; do bash "$d/run.sh"; done
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check --no-build
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - run: bash publications/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: book, path: pdf/ }
